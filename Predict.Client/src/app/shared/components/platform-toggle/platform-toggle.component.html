@if (switchConfig(); as switch) {
  <button
    class="platform-toggle__switch"
    [class.platform-toggle__switch--active]="checked()"
    [class.platform-toggle__switch--xsmall]="switch.size === 'xsmall'"
    [disabled]="switch.disabled"
    [attr.aria-label]="switch.ariaLabel"
    [attr.aria-checked]="checked()"
    (click)="toggle()"
    role="switch"
    type="button"
  >
    <span class="platform-toggle__switch-thumb"></span>
  </button>
} @else if (config().type === 'theme') {
  <button
    type="button"
    class="platform-toggle__theme"
    [attr.aria-label]="
      'Current theme: ' + themeService.themeLabel() + '. Cycle themes'
    "
    [attr.title]="'Theme: ' + themeService.themeLabel() + ' (cycle themes)'"
    (click)="themeService.toggleTheme()"
  >
    <svg
      class="platform-toggle__theme-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      @if (themeService.theme() === 'light') {
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
        />
      } @else if (themeService.theme() === 'dim') {
        <circle cx="12" cy="12" r="8" />
        <path d="M12 4a8 8 0 0 0 0 16Z" fill="currentColor" />
      } @else {
        <path d="M20.9 13A9 9 0 1 1 11 3.1 9 9 0 0 0 20.9 13Z" />
      }
    </svg>
    <span class="platform-toggle__theme-label">{{
      themeService.themeLabel()
    }}</span>
  </button>
} @else if (selectionConfig(); as selection) {
  <div
    class="platform-toggle__options"
    [class.platform-toggle__options--tabs]="selection.type === 'tabs'"
    [class.platform-toggle__options--toolbar]="selection.type === 'toolbar'"
    role="group"
    [attr.aria-label]="selection.ariaLabel"
  >
    @if (selection.options.length > 0) {
      <span
        class="platform-toggle__slider"
        [style.width]="'calc((100% - 6px) / ' + selection.options.length + ')'"
        [style.transform]="
          'translateX(' + getSelectedIndex(selection.options) * 100 + '%)'
        "
        [style.background]="selection.gradient ? getGradient(selection) : null"
        aria-hidden="true"
      ></span>
    }

    @for (option of selection.options; track getOptionLabel(option)) {
      <button
        class="platform-toggle__option"
        [class.platform-toggle__option--active]="
          getOptionValue(option) === selected()
        "
        [disabled]="selection.disabled"
        [attr.aria-label]="getOptionLabel(option)"
        [attr.aria-pressed]="getOptionValue(option) === selected()"
        (click)="select(option)"
        type="button"
      >
        @if (getOptionIcon(option); as iconPath) {
          <img [src]="iconPath" alt="" aria-hidden="true" />
        } @else {
          {{ getOptionLabel(option) }}
        }
      </button>
    }
  </div>
}
