<p-top-bar>
  <ng-container module-navigation> </ng-container>
  <p-loan-insights topbar-actions />
</p-top-bar>

<div class="loan-controls-card mx-2 mb-2">
  <div class="loan-controls-top-row">
    <p-dropdown-select
      class="loan-controls-select"
      [items]="dropDownSelectOptions()"
      [selectedItem]="selectedRepaymentScheduleName()"
      placeholder="No Selection"
      (selectionChange)="onDropdownSelected($event)"
    />
  </div>
  <p-simulation-combinations
    [maxPayments]="selectedOverviewSchedule()?.monthlyInstalments?.length"
    [showCombinations]="includeSimulation()"
  >
    <div class="loan-controls-toggle" combination-leading-action>
      <span>Fixed rate · 5.79%</span>
      <p-platform-toggle
        [config]="{
          type: 'switch',
          value: calculateRepaymentSchedules(),
          ariaLabel: 'Calculate repayment schedules',
          size: 'xsmall',
        }"
        (toggleChange)="onCalculateRepaymentSchedulesChanged($event)"
      />
    </div>
  </p-simulation-combinations>
</div>

<div class="m-2">
  <div class="mb-2">
    <p-loan-detailed-header />
  </div>
  <p-loan-detailed-body />
</div>
