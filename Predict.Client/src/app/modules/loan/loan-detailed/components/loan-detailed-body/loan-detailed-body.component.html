<div class="charts-container mb-2">
  @if (chartBasePaymentChange() === 'pie-chart') {
    <p-highcharts-wrapper
      class="chart-wrapper"
      [chartOptions]="interestProgressPieChart()"
      ><ng-container p-highcharts-wrapper-content>
        <div class="chart-toolbar my-2">
          <div class="chart-type-toggle">
            <ng-container *ngTemplateOutlet="chartTypeSelector"></ng-container>
          </div>
          <div class="simulation-toggle">
            <span>Simulation</span>
            <p-platform-toggle
              [config]="{
                type: 'sliding',
                options: ['OFF', 'ON'],
                selected: includeSimulation() ? 'ON' : 'OFF',
                ariaLabel: 'Include simulated values in detailed view',
              }"
              (selectionChange)="onIncludeSimulationChanged($event === 'ON')"
            />
          </div>
        </div> </ng-container
    ></p-highcharts-wrapper>
  } @else if (
    chartBasePaymentChange() === 'Prd. Fixa' ||
    chartBasePaymentChange() === 'Prd. Totala'
  ) {
    <p-highcharts-wrapper
      class="chart-wrapper"
      [chartOptions]="loanMonthlyPaymentsChart()"
    >
      <ng-container p-highcharts-wrapper-content>
        <div class="chart-toolbar my-2">
          <div class="chart-type-toggle">
            <ng-container *ngTemplateOutlet="chartTypeSelector"></ng-container>
          </div>
          <div class="simulation-toggle">
            <span>Simulation</span>
            <p-platform-toggle
              [config]="{
                type: 'sliding',
                options: ['OFF', 'ON'],
                selected: includeSimulation() ? 'ON' : 'OFF',
                ariaLabel: 'Include simulated values in detailed view',
              }"
              (selectionChange)="onIncludeSimulationChanged($event === 'ON')"
            />
          </div>
        </div> </ng-container
    ></p-highcharts-wrapper>
  } @else if (chartBasePaymentChange() === 'dot-bar-chart') {
    <p-highcharts-wrapper class="chart-wrapper" [chartOptions]="dotBarChart()">
      <ng-container p-highcharts-wrapper-content>
        <div class="chart-toolbar my-2">
          <div class="chart-type-toggle">
            <ng-container *ngTemplateOutlet="chartTypeSelector"></ng-container>
          </div>
          <div class="simulation-toggle">
            <span>Simulation</span>
            <p-platform-toggle
              [config]="{
                type: 'sliding',
                options: ['OFF', 'ON'],
                selected: includeSimulation() ? 'ON' : 'OFF',
                ariaLabel: 'Include simulated values in detailed view',
              }"
              (selectionChange)="onIncludeSimulationChanged($event === 'ON')"
            />
          </div>
        </div> </ng-container
    ></p-highcharts-wrapper>
  } @else {
    <p-highcharts-wrapper
      class="chart-wrapper"
      [chartOptions]="interestProgressBarChart()"
      ><ng-container p-highcharts-wrapper-content>
        <div class="chart-toolbar my-2">
          <div class="chart-type-toggle">
            <ng-container *ngTemplateOutlet="chartTypeSelector"></ng-container>
          </div>
          <div class="simulation-toggle">
            <span>Simulation</span>
            <p-platform-toggle
              [config]="{
                type: 'sliding',
                options: ['OFF', 'ON'],
                selected: includeSimulation() ? 'ON' : 'OFF',
                ariaLabel: 'Include simulated values in detailed view',
              }"
              (selectionChange)="onIncludeSimulationChanged($event === 'ON')"
            />
          </div>
        </div> </ng-container
    ></p-highcharts-wrapper>
  }
</div>

<ng-template #chartTypeSelector>
  <p-platform-toggle
    [config]="{
      type: 'sliding',
      options: [
        {
          label: 'Pie chart',
          value: 'pie-chart',
          iconPath: 'assets/icons/pie-chart.svg',
        },
        {
          label: 'Bar chart',
          value: 'bars-chart',
          iconPath: 'assets/icons/bar-chart.svg',
        },
        {
          label: 'Payments (5 years)',
          value: 'Prd. Fixa',
          iconPath: 'assets/icons/column-chart.svg',
        },
        {
          label: 'Payments (full term)',
          value: 'Prd. Totala',
          iconPath: 'assets/icons/column-chart.svg',
        },

        {
          label: 'Rate comparison',
          value: 'dot-bar-chart',
          iconPath: 'assets/icons/dot-bar-chart.svg',
        },
      ],
      selected: chartBasePaymentChange(),
      ariaLabel: 'Chart type',
    }"
    (selectionChange)="onChartBasePaymentChange($event)"
  />
</ng-template>

<p-historical-instalments-table
  [monthlyInstalmentGroups]="historicalInstalmentPaymentBatches()"
  [simulationInstalmentGroups]="visibleSimulationMonthlyInstalmentBatches()"
></p-historical-instalments-table>
