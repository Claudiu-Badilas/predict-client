<p-top-bar [hasFiltersContent]="true">
  <ng-container module-navigation> </ng-container>
  <p-loan-insights topbar-actions />

  <ng-container filter-content>
    <p-dropdown-select
      [items]="dropDownSelectOptions()"
      [selectedItem]="selectedRepaymentScheduleName()"
      placeholder="No Selection"
      (selectionChange)="onDropdownSelected($event)"
    />

    <!-- Simulation combination rows -->
    <div class="simulation-rows">
      @for (row of simulationRows(); track row.id; let i = $index) {
        <div class="simulation-row pt-2">
          <div class="gap-2 d-flex align-items-center justify-content-between">
            <p-numeric-input
              [id]="'monthlyAmount_' + row.id"
              label="Amount"
              [control]="simulationRowsFormArray.at(i).controls.monthlyAmount"
            />
            <p-numeric-input
              [id]="'payments_' + row.id"
              label="Payments"
              [control]="simulationRowsFormArray.at(i).controls.payments"
            />

            <button
              type="button"
              class="btn-delete"
              [disabled]="simulationRows().length === 1"
              [attr.aria-label]="'Delete simulation row ' + (i + 1)"
              (click)="removeRow(row.id)"
            >
              ✕
            </button>
          </div>
        </div>
      }
    </div>

    <div class="pt-2">
      <button
        type="button"
        class="btn-add"
        [disabled]="simulationForm.invalid"
        (click)="addRow()"
      >
        + Add combination
      </button>
    </div>

    <div class="pt-2 d-flex align-items-center justify-content-between">
      <div class="sidebar-label">Dobanda Fixa 5.79%</div>
      <div>
        <p-platform-toggle
          [config]="{
            type: 'switch',
            value: calculateRepaymentSchedules(),
            ariaLabel: 'Calculate repayment schedules',
          }"
          (toggleChange)="onCalculateRepaymentSchedulesChanged($event)"
        />
      </div>
    </div>
  </ng-container>
</p-top-bar>

<div class="m-2">
  <p-loan-simulator-header
    [monthlyInstalmentGroups]="monthlyInstalmentBatches()"
  ></p-loan-simulator-header>

  <p-loan-simulator-body-table
    [monthlyInstalmentGroups]="monthlyInstalmentBatches()"
  />
</div>
