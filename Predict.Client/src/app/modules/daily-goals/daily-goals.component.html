<p-top-bar>
  <ng-container module-navigation> </ng-container>
</p-top-bar>

<main class="daily-goals">
  <header class="daily-goals-header">
    <h1>Daily Goals</h1>
    <fieldset class="date-range">
      <legend>From / To</legend>
      <p-date-range-picker
        [startDate]="fromDate()"
        [endDate]="toDate()"
        [minDate]="minDate"
        [maxDate]="maxDate"
        (valueChanged)="onDateRangeChange($event)"
      ></p-date-range-picker>
    </fieldset>
  </header>
  <p-activity-calendar
    [fromDate]="fromDate()"
    [toDate]="toDate()"
  ></p-activity-calendar>
</main>
