<section class="activity-calendar" aria-label="Activity calendar">
  <div class="calendar-summary">
    <strong
      >{{ daysWithStatus() | number }} / {{ availableDays() | number }} days
      marked</strong
    >
  </div>

  <div
    class="calendar-scroll"
    role="group"
    aria-label="Daily contributions for the selected date range"
  >
    <div class="calendar" [style.--empty-cell-color]="emptyColor()">
      <div class="weekday-labels" aria-hidden="true">
        <span></span>
        <span>Mon</span>
        <span></span>
        <span>Wed</span>
        <span></span>
        <span>Fri</span>
        <span></span>
      </div>

      <div class="weeks">
        @for (week of weeks(); track $index) {
          <div class="week">
            <div class="month-heading">
              <span class="month-label">{{ week.monthLabel }}</span>
              <span class="year-label">{{ week.yearLabel }}</span>
            </div>
            @for (day of week.days; track day.date.getTime()) {
              <button
                type="button"
                class="day"
                [class]="'day level-' + day.level"
                [style.background-color]="getCustomColor(day.date)"
                [attr.aria-label]="getDayAccessibleLabel(day)"
                [ngbTooltip]="getDayAccessibleLabel(day)"
                [class.outside-range]="!day.inRange"
                [disabled]="!day.inRange"
                (click)="cycleDayColor(day.date, day.inRange)"
              ></button>
            }
          </div>
        }
      </div>
    </div>
  </div>

  <div
    class="custom-legend"
    aria-hidden="true"
    [style.--default-empty-color]="emptyColor()"
  >
    @for (option of colorOptions(); track option.id) {
      <span class="custom-legend__item">
        <span
          class="color-swatch"
          [class.color-swatch--default]="option.id === 'default'"
          [style.background-color]="
            option.id === 'default' ? null : getColorOptionColor(option)
          "
        ></span>
        {{ option.label }}
      </span>
    }
  </div>
</section>
